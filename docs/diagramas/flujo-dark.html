<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo valida AntiBot un formulario</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #080e16; color: #e3e8ee; padding: 3rem 1rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 112 960 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-dark-title flujo-dark-desc">
        <title id="flujo-dark-title">Cómo valida AntiBot un formulario</title>
        <desc id="flujo-dark-desc">El formulario envía el token, AntiBot lo verifica con el proveedor y la solicitud sigue al controlador o se rechaza con 422 o 403.</desc>
        <defs>
          <marker id="flujo-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a2acb7"/></marker>
          <marker id="flujo-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5aa9f2"/></marker>
        </defs>
        <rect x="0" y="112" width="960" height="296" fill="#080e16"/>

        <line x1="680" y1="224" x2="560" y2="224" stroke="#a2acb7" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#flujo-dark-arrow)"/>
        <line x1="440" y1="264" x2="440" y2="320" stroke="#5aa9f2" stroke-width="1.4" marker-end="url(#flujo-dark-arrow-accent)"/>
        <rect x="244.0" y="151" width="52" height="16" rx="2" fill="#080e16"/>
        <text x="270" y="163" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN</text>
        <rect x="228.0" y="199" width="84" height="16" rx="2" fill="#080e16"/>
        <text x="270" y="211" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">422 O 403</text>
        <rect x="582.0" y="151" width="76" height="16" rx="2" fill="#080e16"/>
        <text x="620" y="163" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VERIFICA</text>
        <rect x="578.0" y="199" width="84" height="16" rx="2" fill="#080e16"/>
        <text x="620" y="211" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESULTADO</text>
        <rect x="40" y="152" width="180" height="96" rx="6" fill="#080e16"/>
        <rect x="40" y="152" width="180" height="96" rx="6" fill="#121921" stroke="#e3e8ee" stroke-width="1"/>
        <text x="130.0" y="198.0" fill="#e3e8ee" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Formulario</text>
        <text x="130.0" y="216.0" fill="#a2acb7" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">token del widget</text>
        <rect x="320" y="136" width="240" height="128" rx="6" fill="#080e16"/>
        <rect x="320" y="136" width="240" height="128" rx="6" fill="rgba(90,169,242,0.12)" stroke="#5aa9f2" stroke-width="1.4"/>
        <text x="440.0" y="198.0" fill="#e3e8ee" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">AntiBot</text>
        <text x="440.0" y="216.0" fill="#a2acb7" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">abitechdev/antibot-laravel</text>
        <rect x="680" y="136" width="240" height="128" rx="6" fill="#080e16"/>
        <rect x="680" y="136" width="240" height="128" rx="6" fill="rgba(227,232,238,0.03)" stroke="rgba(227,232,238,0.30)" stroke-width="1"/>
        <text x="800.0" y="198.0" fill="#e3e8ee" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Proveedor</text>
        <text x="800.0" y="216.0" fill="#a2acb7" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Turnstile o reCAPTCHA</text>
        <rect x="340" y="320" width="200" height="64" rx="6" fill="#080e16"/>
        <rect x="340" y="320" width="200" height="64" rx="6" fill="#121921" stroke="#e3e8ee" stroke-width="1"/>
        <text x="440.0" y="350.0" fill="#e3e8ee" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Tu controlador</text>
        <text x="440.0" y="368.0" fill="#a2acb7" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">solo si pasa</text>
      </svg>
    </div>
  </div>
</body>
</html>
