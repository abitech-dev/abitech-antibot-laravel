<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Cómo valida AntiBot un formulario</title>
  <desc id="descripcion">El formulario envía el token, AntiBotRule lo verifica con el proveedor y la solicitud pasa o recibe un error de validación.</desc>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="920" height="250" rx="16" fill="#ffffff"/>
  
  <rect x="24" y="88" width="170" height="74" rx="12"
        fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="109.0" y="120" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700" fill="#1f2328">Formulario</text>
  <text x="109.0" y="142" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12" fill="#59636e">cf-turnstile-response</text>
  
  <line x1="194" y1="125" x2="262" y2="125" stroke="#59636e"
        stroke-width="1.5" marker-end="url(#punta)"/><text x="228.0" y="117" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">token</text>
  
  <rect x="264" y="88" width="190" height="74" rx="12"
        fill="#ddf4ff" stroke="#1c6ccc" stroke-width="1.5"/>
  <text x="359.0" y="120" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700" fill="#1f2328">AntiBotRule</text>
  <text x="359.0" y="142" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12" fill="#59636e">token + IP + acción</text>
  
  <line x1="454" y1="125" x2="522" y2="125" stroke="#59636e"
        stroke-width="1.5" marker-end="url(#punta)"/><text x="488.0" y="117" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">verifica</text>
  
  <rect x="524" y="88" width="200" height="74" rx="12"
        fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="624.0" y="120" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700" fill="#1f2328">Proveedor</text>
  <text x="624.0" y="142" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12" fill="#59636e">Turnstile o reCAPTCHA</text>
  
  <line x1="724" y1="112" x2="762" y2="66" stroke="#59636e"
        stroke-width="1.5" marker-end="url(#punta)"/>
  
  <line x1="724" y1="138" x2="762" y2="184" stroke="#59636e"
        stroke-width="1.5" marker-end="url(#punta)"/>
  
  <rect x="764" y="30" width="132" height="66" rx="12"
        fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="830.0" y="62" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700" fill="#1f2328">Pasa</text>
  <text x="830.0" y="84" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12" fill="#59636e">al controlador</text>
  
  <rect x="764" y="154" width="132" height="66" rx="12"
        fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="830.0" y="186" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700" fill="#1f2328">Rechaza</text>
  <text x="830.0" y="208" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12" fill="#59636e">422 o 403</text>
</svg>
